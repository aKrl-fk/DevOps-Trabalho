name: CI - Diário de Leitura

on:
  push:
    branches: [main, desenvolvimento]
  pull_request:
    branches: [main, desenvolvimento]

jobs:
  build-backend:
    name: Build e verificação do backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Verificar se a aplicação importa corretamente
        working-directory: ./backend
        env:
          DATABASE_URL: "sqlite:///./teste.db"
        run: python -c "from app.main import app; print('Aplicação carregada com sucesso')"

  build-docker-images:
    name: Build das imagens Docker
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem da API
        run: docker build -t diario-api ./backend

      - name: Build da imagem do frontend
        run: docker build -t diario-frontend ./frontend
