<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diário de Leitura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>📖 Meu Diário</h1>
      <button class="theme-toggle" id="theme-toggle" title="Alternar tema">🌙</button>
    </div>

    <button class="btn-novo" id="btn-novo-livro">+ Novo livro</button>

    <nav class="status-filters" id="status-filters">
      <button data-status="" class="active">Todos</button>
      <button data-status="quero_ler">Quero ler</button>
      <button data-status="lendo">Lendo agora</button>
      <button data-status="lido">Lidos</button>
      <button data-status="abandonado">Abandonados</button>
    </nav>

    <div class="shelf" id="shelf">
      <!-- livros injetados via JS -->
    </div>
  </aside>

  <main class="main" id="main">
    <p class="empty-state">Selecione um livro na estante, ou adicione um novo para começar. 🍂</p>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/theme.js"></script>
<script src="js/app.js"></script>
</body>
</html>
